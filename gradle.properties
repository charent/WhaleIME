# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Kotlin 2.x + Compose 编译器插件 + KSP + R8 的内存占用明显高于旧工具链，
# 1536m 下 assembleRelease 会 OOM；Kotlin 改为 in-process 后编译器也吃这个堆，给到 4G。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# 4 个模块（app / ime-ui / ime-core / ime-native）互不写同一份输出，可以并行。
# 之前只有一个 whalesdk，并行收益为零，现在能同时跑各模块的 compile/ksp/res。
org.gradle.parallel=true

# Kotlin 编译改在 Gradle 守护进程内执行（不另起 kotlin-daemon）。
# 独立 Kotlin 编译守护进程曾出现「编译会话结束后 Gradle 一直等它回结果」的卡死：
# 表现为 CPU/磁盘全闲、daemon 日志长时间不增长、jstack 里 Execution worker 停在
# DefaultAsyncWorkTracker.waitForItemsAndGatherFailures。本机内存充裕（64 GB），
# 进程内的额外开销可以忽略，换来的是不再有这个跨进程悬挂点。
kotlin.compiler.execution.strategy=in-process
android.injected.build.model.only.versioned = 3
android.useAndroidX=true
# Phase 5：项目内已无任何 support-library 依赖，Jetifier 可以关掉（构建更快、避免无谓改写）
android.enableJetifier=false
android.enableR8.fullMode=true