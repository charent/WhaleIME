traditionalize:
  opencc_config: s2t.json
  option_name: traditionalization
grammar:
  # 与全键方案共用共享目录的 zh-hans.gram。14 键一码多音节（DA = da/fa），
  # 整句需要 n-gram 打分才能和 26 键的排序质量对齐（同九键的理由）。
  language: zh-hans
translator:
  always_show_comments: true
  # 上下文敏感排序：已上屏的前文一起进 n-gram 打分（依赖上面的 grammar）
  contextual_suggestions: true
  dictionary: pinyin
  initial_quality: 1.2
  prism: t14_pinyin
  spelling_hints: 100
  # 切分先验重排：14 键按键多对一时先按 n-gram 决定「哪种切分更像话」，
  # 再在同一切分内按词条权重选词（同九键）。
  segmentation_prior: true
  # 引擎原生拼写纠错：14 键的输入是键码串，corrector 按**键码层**的编辑距离
  # （邻键表见 rime-corrector-whale.cc 里的大写键码段）纠正漏按/多按/换位/按错键。
  # Kotlin 侧开关经 CorrectionSchema 落成 t14_pinyin.custom.yaml patch。
  enable_correction: true

menu:
  page_size: 5
