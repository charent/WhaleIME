# 14 键拼音方案：QW/ER/TY/UI/OP · AS/DF/GH/JK/L · ZX/CV/BN/M
#
# 与 t9_pinyin 同构：键盘送进引擎的是「键位代表字母」串（大写键码），
# speller/algebra 用 derive 把音节映射成键码，候选栏点选读音后用 replaceKey
# 换成小写拼音仍能查到音节图。词表与九键共用 pinyin.table.bin，但 prism 独立
# （拼写集合不同，必须由 scripts/precompile-dict.ps1 单独编译）。
emoji:
  inherit_comment: false
  opencc_config: emoji.json
  option_name: emoji
engine:
  filters:
    - "simplifier@emoji"
    - "simplifier@traditionalize"
    - uniquifier
  processors:
    - ascii_composer
    - recognizer
    - speller
    - punctuator
    - selector
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - echo_translator
    - script_translator
punctuator:
  symbols:
    "/": ["@", "＃", "＊", "＋", "……", "〜", "（", "）", "、", "/"]
recognizer:
  patterns:
    punct: "^/([0-9]|10|[A-Za-z]*?)$"
schema:
  name: "14键拼音"
  schema_id: t14_pinyin
