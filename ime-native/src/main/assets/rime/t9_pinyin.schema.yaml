traditionalize:
  opencc_config: s2t.json
  option_name: traditionalization
grammar:
  # 八股文语法模型（librime-octagram），与全键方案共用共享目录的 zh-hans.gram。
  # 九键的歧义比全拼大一个量级：同一串按键能切出完全不同的音节
  # （943 28 426 → zhe'bu'hao 或 yi'da'tiao），覆盖长度又是满的，
  # 没有 n-gram 时只能比较「逐词词频之和」，生僻整词（一大跳/一大条）
  # 会压过常用的字词组合（这不好/这不合适）。接入 grammar 后整句按
  # 语言模型打分，才和 26 键的排序质量对齐。
  language: zh-hans
translator:
  always_show_comments: true
  # 上下文敏感排序：已上屏的前文一起进 n-gram 打分（依赖上面的 grammar，
  # 缺失时本开关静默无效）。
  contextual_suggestions: true
  dictionary: pinyin
  initial_quality: 1.2
  prism: t9_pinyin
  spelling_hints: 100
  # 切分先验重排（WhaleIME，2026-10-26）：句首 + 满覆盖 + 同一串按键能切出多种
  # 音节时，先按 n-gram 分决定「哪种切分更像话」，再在同一切分内按词条权重选词。
  # 只对九键开：按键多对一才需要它；26 键开这个会让 top1 大幅退化（实测 77.5%→30.0%）。
  segmentation_prior: true

menu:
  page_size: 5
