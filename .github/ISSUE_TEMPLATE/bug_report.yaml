name: 问题报告 / Bug Report
description: 创建问题报告以帮助我们改进。 / Create a bug report to help us improve.
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索[已有 issue](https://github.com/charent/WhaleIME/issues?q=is%3Aissue)，
        并确认问题在[最新版本](https://github.com/charent/WhaleIME/releases/latest)上依然存在。
        / Please search existing issues and check the latest release before submitting.

  - type: textarea
    id: summary
    attributes:
      label: 摘要 / Summary
      description: 简要描述遇到的问题。 / Briefly describe the problem.
      placeholder: 例：九键输入 zhongguo 后选词，候选栏闪一下又回到未上屏状态。 / eg. ...
    validations:
      required: true

  - type: textarea
    id: step_to_reproduce
    attributes:
      label: 重现步骤 / Steps to Reproduce
      description: 如何重现该问题。 / How to reproduce the bug.
      placeholder: |
        1. 打开某界面 / Open page ...
        2. 点击某菜单 / Click menu ...
        3. 某处出问题 / Something went wrong ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 预期行为 / Expected Behavior
      description: 完成上述步骤后应该发生什么。 / What is expected to happen after the steps above.
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: 截图 / Screenshot
      description: 附上截图以帮助解释问题（可直接拖入或粘贴）。 / Attach screenshots to help explain the bug.
    validations:
      required: false

  - type: textarea
    id: crash_log
    attributes:
      label: 崩溃日志 / Crash Log
      description: |
        崩溃 / 闪退时请附上日志：在「设置 → 高级设置 → 导出崩溃日志」生成 zip，再把该 zip 拖进这里。
        / If the app crashes, export the zip via Settings → Advanced → Export crash logs and drop it here.
      placeholder: 拖入 whaleIme_crash_log_*.zip / Drag the exported zip here.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: 附加信息 / Additional Context
      description: 与此问题相关的上下文信息，比如在问题出现前做了什么、使用了什么主题等。 / Additional context about the bug, eg. what did you do before the bug appears or what theme you are using, etc.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### 设备信息 / Device Information
        以下条目可在「设置 → 关于」页找到（可截图）。 / These entries are on the Settings → About page.

  - type: input
    id: os_version
    attributes:
      label: 系统版本 / OS Version
      description: 例如 Android 15。 / eg. Android 15.
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: 版本 / App Version
      description: 「关于 → 版本」，形如 261122.1530。 / Settings → About → Version, eg. 261122.1530.
    validations:
      required: true

  - type: input
    id: build_git_hash
    attributes:
      label: 构建哈希 / Build Hash
      description: 「关于 → 构建哈希」。 / Settings → About → Build hash.
    validations:
      required: true

  - type: input
    id: build_time
    attributes:
      label: 构建时间 / Build Time
      description: 「关于 → 构建时间」。 / Settings → About → Build time.
    validations:
      required: false
