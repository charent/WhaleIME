name: 功能请求 / Feature Request
description: 为本项目提供新功能建议 / Suggest a new feature for this project
labels:
  - enhancement

body:
  - type: textarea
    id: summary
    attributes:
      label: 摘要 / Summary
      description: 新功能应该做什么。 / What the new feature should do.
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: 替代方案 / Alternative Solution
      description: 其它可能的解决方案（如果有）。 / Other possible solutions, if any.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: 附加信息 / Additional Context
      description: 与此功能请求有关的上下文信息或截图。 / Additional context or screenshots about the feature request.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### 设备信息 / Device Information
        以下条目可在「设置 → 关于」页找到（可截图）。 / These entries are on the Settings → About page.

  - type: input
    id: os_version
    attributes:
      label: 系统版本 / OS Version
      description: 例如 Android 15。 / eg. Android 15.
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: 版本 / App Version
      description: 「关于 → 版本」，形如 261122.1530。 / Settings → About → Version, eg. 261122.1530.
    validations:
      required: true

  - type: input
    id: build_git_hash
    attributes:
      label: 构建哈希 / Build Hash
      description: 「关于 → 构建哈希」。 / Settings → About → Build hash.
    validations:
      required: false
