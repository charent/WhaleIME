// :ime-ui —— Compose 键盘 + 设置界面 + Android 组件（Activity / IME 服务 / JobService）
//
// 依赖方向：app → ime-ui → ime-core → ime-vendor。本模块不得被 core 反向依赖。
// 只有这里启用 Compose 编译器插件；:ime-core 明确不开 Compose。

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-parcelize'
    id 'kotlinx-serialization'
}

android {
    compileSdk whaleCompileSdk
    namespace 'com.whale.ime.ui'

    defaultConfig {
        minSdk whaleMinSdk

        // 构建信息只在本模块展示（设置页「关于」），版本号不在这里造：
        // 唯一来源是 app 的 versionName，库内通过 PackageManager 读取。
        // git 头/提交时间由根 build.gradle 的 ext 闭包提供，全仓只定义一次。
        buildConfigField "String", "AppCommitHead", "\"${rootProject.ext.whaleGitHead()}\""
        buildConfigField "String", "AppBuildTime", "\"${rootProject.ext.whaleBuildTime()}\""
    }

    buildFeatures {
        compose = true
        // AGP 8 默认关闭 buildConfig，上面两个 buildConfigField 需要它
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility whaleJavaVersion
        targetCompatibility whaleJavaVersion
    }
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(whaleJvmTarget)
        }
    }
}

dependencies {
    // api：UI 的公开签名里出现 core 的类型（CandidateState / AppPrefs / ManagedPreference…），
    // 宿主 app 也必须能看到它们与 core 的 R
    api project(':ime-core')

    // 本模块 3 个文件直接用 PinyinHelper（设置搜索、常用语简拼、用户词库加词）
    implementation project(':ime-vendor')

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.emoji2:emoji2:1.5.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.20"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    // 主题裁剪 / 换图读取 EXIF
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // ---- Jetpack Compose ----
    // BOM 取 2025 稳定版：material3 1.3.x + foundation 1.8.x，
    // 其字节码元数据与 Kotlin 2.1.x 编译器兼容（更新的 2026.x BOM 由 Kotlin 2.2+ 编译，不可用）。
    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-text'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    // 高层动画（animateColorAsState / AnimatedContent）：候选词选中态、面板切换过渡
    implementation 'androidx.compose.animation:animation'
    // collectAsStateWithLifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    // activity-compose 用 api：宿主 app 的 manifest 要声明本模块的 Activity，
    // lint 的 Instantiatable 检查必须能沿着类链看到 ComponentActivity → Activity，
    // 否则报 "LauncherActivity must extend android.app.Activity"。
    api 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
}
